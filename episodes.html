  // تغيير الحلقات
  const episodes = [
    { title: "Episode 1: The Brand", file: "episodes/Berkserk Ep 01 مترجم.mp4" },
    { title: "Episode 2: The Eclipse", file: "episodes/Berkserk Ep 02 مترجم.mp4" },
    { title: "Episode 3: Black Swordsman", file: "episodes/Berkserk Ep 03 مترجم.mp4" }
  ];

  function showEpisode(index) {
    const player = document.getElementById("videoPlayer");
    const source = document.getElementById("videoSource");
    const title = document.getElementById("currentTitle");

    // تغيير عنوان الحلقة
    title.textContent = episodes[index].title;

    // تغيير مصدر الفيديو
    source.src = episodes[index].file;
    player.load();
    player.play();
  }
  
</script>
<script> // صوت النقر عند الضغط على الروابط
  const clickSound = new Audio("mouse click audio/click_2.mp3");
  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function (e) {
      e.preventDefault();
      clickSound.currentTime = 0;
      clickSound.play();
      setTimeout(() => {
        window.location.href = this.href;
      }, 280);
    });
  });</script>
  
  <script>
  // تأثير دخول الصفحة
  document.body.classList.add("fade-in");

  // تأثير عند الانتقال لرابط
  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function (e) {
      const url = this.href;
      if (url.includes("#") || url.startsWith("javascript")) return; // تجاهل الروابط الداخلية أو الزائفة

      e.preventDefault(); // إيقاف التنقل المؤقت
      document.body.classList.add("fade-out");

      // بعد انتهاء تأثير الخروج، انتقل للرابط
      setTimeout(() => {
        window.location.href = url;
      }, 600); // نفس مدة الانتقال الموجودة في CSS
    });
  });
</script>

<script>
  const clickSound = new Audio("sowrd-click.mp3");
  const transitionOverlay = document.getElementById("page-transition");

  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function (e) {
      const url = this.href;

      if (!url || url.includes("#") || url.startsWith("javascript")) return;

      e.preventDefault();

      // تشغيل صوت النقر
      clickSound.currentTime = 0;
      clickSound.play();

      // تفعيل طبقة التلاشي
      transitionOverlay.classList.add("active");

      // الانتقال بعد التلاشي
      setTimeout(() => {
        window.location.href = url;
      }, 600); // المدة تتطابق مع transition في CSS
    });
  });

  // عند الدخول إلى الصفحة، اخفاء طبقة التلاشي (لإظهار fade-in)
  window.addEventListener("DOMContentLoaded", () => {
    transitionOverlay.classList.remove("active");
  });
</script>

<script>
  document.body.classList.add("fade-in");

  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function (e) {
      const url = this.href;
      if (url.includes("#") || url.startsWith("javascript")) return;

      e.preventDefault();
      document.body.classList.add("fade-out");

      setTimeout(() => {
        window.location.href = url;
      }, 600);
    });
  });
</script>
